[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "reacnet-scope"
version = "0.1.0"
description = "Interactive post-processing and analysis software for ReacNetGenerator species, reaction events, and reaction networks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.10",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "rdkit>=2023.9",
  "scipy>=1.11",
]
keywords = ["reacnetgenerator", "reaction-network", "md", "chemistry", "smiles"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
# Each extra serves one install purpose; see README "依赖".
# Dash Web runtime (deployment: --extra web --extra trajectory).
web = [
  "dash[diskcache]>=4,<5",
  "dash-bootstrap-components>=2,<3",
  "dash-cytoscape>=1,<2",
  "dash-ag-grid>=35.2,<36",
]
# Trajectory, geometry and event-package export (ASE).
trajectory = [
  "ase>=3.23,<4",
]
# CLI PNG export: species-evolution --out-png.
plot = [
  "matplotlib>=3.8",
]

[project.scripts]
reacnet-scope = "scripts.rng_query_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["reacnet_scope", "scripts"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/LICENSE",
  "/start-reacnet-scope.sh",
  "/pyproject.toml",
  "/uv.lock",
  "/examples",
  "/docs",
  "/deploy",
  "/reacnet_scope",
  "/scripts",
]

[tool.uv]
package = true
default-groups = ["dev"]

[dependency-groups]
browser = [
    "playwright>=1.55,<2",
]
dev = [
  { include-group = "test" },
]
test = [
  "pytest>=8,<9",
  "dash[diskcache]>=4,<5",
  "dash-bootstrap-components>=2,<3",
  "dash-cytoscape>=1,<2",
  "dash-ag-grid>=35.2,<36",
  "ase>=3.23,<4",
  "matplotlib>=3.8",
]
