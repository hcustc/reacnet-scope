[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "reacnet-scope"
version = "0.1.0"
description = "Interactive post-processing and analysis software for ReacNetGenerator species, reaction events, and reaction networks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.10",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "rdkit>=2023.9",
]
keywords = ["reacnetgenerator", "reaction-network", "md", "chemistry", "smiles"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
plot = [
  "matplotlib>=3.8",
  "scipy>=1.11",
]
web = [
  "dash[diskcache]>=4,<5",
  "dash-bootstrap-components>=2,<3",
  "dash-cytoscape>=1,<2",
  "matplotlib>=3.8",
  "scipy>=1.11",
]
trajectory = [
  "ase>=3.23,<4",
]

[project.scripts]
reacnet-scope = "scripts.rng_query_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["reacnet_scope", "scripts"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/uv.lock",
  "/examples",
  "/docs",
  "/deploy",
  "/reacnet_scope",
  "/scripts",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8,<9",
]
