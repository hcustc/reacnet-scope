name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync locked development environment
        run: uv sync --locked

      - name: Run complete test suite
        run: uv run --locked pytest -q

  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - name: Sync optional browser tools
        run: uv sync --locked --group browser
      - name: Install Chromium
        run: uv run --locked --group browser playwright install --with-deps chromium
      - name: Exercise the offline workbench
        timeout-minutes: 30
        env:
          REACNET_SCOPE_BROWSER_TESTS: "1"
          REACNET_SCOPE_SCREENSHOTS: /tmp/reacnet-ui-screenshots
        run: >-
          uv run --locked --group browser pytest -x -vv --tb=short
          --show-capture=no --durations=15 -o faulthandler_timeout=120
          --junitxml=/tmp/reacnet-browser-results.xml
          tests/browser --browser-shard=${{ matrix.shard }}/4
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-browser-${{ matrix.shard }}
          path: |
            /tmp/reacnet-ui-screenshots
            /tmp/reacnet-browser-results.xml

  # Preserve the existing required-check name and fail if any shard fails,
  # is cancelled, or is skipped.
  browser:
    if: always()
    needs: browser-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser shard
        env:
          BROWSER_RESULT: ${{ needs.browser-tests.result }}
        run: test "$BROWSER_RESULT" = success
